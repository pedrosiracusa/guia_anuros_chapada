# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Anfíbios dos Veadeiros
tagline: "Guia de Identificação de Anuros da Chapada dos Veadeiros"
lang: pt-BR
email: "guiaanuros@gmail.com"
author: "Anfíbios dos Veadeiros"
logo: "/assets/img/anfibios_veadeiros_header.png"
description: >- # this means to ignore newlines until "baseurl:"
  Guia de identificação de anfíbios anuros (sapos, rãs e pererecas) da Chapada
  dos Veadeiros e do Cerrado, com fotos, cantos, distribuição e história
  natural das espécies.
#baseurl: "/guia_anuros_chapada" # the subpath of your site, e.g. /blog
#url: "https://pedrosiracusa.github.io" # substitua pela URL pública em produção (importante para canonical e sitemap.xml)
#twitter_username: jekyllrb
#github_username:  jekyll

repository: "pedrosiracusa/guia_anuros_chapada"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# A list of the pages to display in the navigation bar
header_pages:
  - "especies/index.html"
  - "autores.html"
  

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/img/landingpage/cover.png"

  - scope:
      path: "assets/img"
    values:
      image: true 

  -
    scope:
      path: "especies"
      type: "pages"
    values:
      layout: "species_page"
  
  -
    scope:
      path: "familias"
      type: "pages"
    values:
      layout: "family_page"

  - 
    scope:
      path: "assets/img/sp-avatar"
    values:
      sp-avatar: true


# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - update_boostrap.sh
  - build_species_dset
  - build
