{%- assign page_paths = site.header_pages -%}
<nav class="navbar navbar-expand bg-white border-bottom" id="mainnav">
  <div class="container">
    <a class="navbar-brand py-0" href="{{ "/" | relative_url }}">
      <img id="logo" width="160" src="{{site.baseurl}}/assets/img/anfibios_veadeiros_header.png" alt="{{ site.title | escape }}">
    </a>

    <ul class="navbar-nav ms-auto gap-3">
      {%- for path in page_paths -%}
      {%- assign my_page = site.pages | where: "path", path | first -%}
      {%- if my_page.title -%}
      <li class="nav-item">
        <a class="nav-link" href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a>
      </li>
      {%- endif -%}
      {% endfor -%}
    </ul>
  </div>
</nav>
