
<footer class="py-4 mt-5 border-top text-muted">
  <div class="container">
    <div class="row align-items-center gy-2">
      <div class="col-sm">
        <span class="fw-semibold text-body">{{ site.title | escape }}</span>
        {%- if site.email and site.email != "" -%}
          <br>
          <a class="text-decoration-none text-muted small" href="mailto:{{ site.email }}">
            {{ site.email }}
          </a>
        {%- endif -%}
      </div>
    </div>
  </div>
</footer>
